name = "M1_ENS_26"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["M1ENS26"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.style.multiGoal = false
linter.tacticAnalysis.introMerge = false
linter.style.lambdaSyntax = false
linter.hashCommand = false
linter.style.openClassical = false
linter.unusedVariables = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.27.0-rc1"

[[require]] # This block should be removed after updating to Lean v4.28.0 or later.
name = "UnicodeBasic"
scope = "fgdorais"
rev = "v1.3.0"

[[lean_lib]]
name = "M1ENS26"
